<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GLNG</title>
  <meta name="description" content="GLNG AB — Marinkonsultering inom försvarsindustrin / Fotograf.">
  <meta property="og:title" content="GLNG">
  <meta property="og:description" content="Marinkonsultering inom försvarsindustrin / Fotograf.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://glng.se">
  <link rel="stylesheet" href="styles.css">
  
  <!-- Promoteq Font Stack: Rajdhani for Hero & Headings, Inter for Body -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="site-wrapper">
    <!-- Top indicator -->
    <header class="top-bar">
      <div class="location-tag">GÖTEBORG, SE</div>
    </header>

    <!-- Main Hero & Contact Container -->
    <main class="main-content">
      <div class="hero-block">
        <div class="profile-frame">
          <img src="assets/hampus.png" alt="Hampus Gelang" class="profile-img">
          <div class="profile-caption">HAMPUS GELANG</div>
        </div>
        <h1 class="brand-title">GLNG<span class="brand-dot">.</span></h1>
        <p class="brand-sub">Marinkonsultering inom försvarsindustrin <span class="divider">/</span> Fotograf</p>
      </div>

      <!-- Minimalist Contact Section -->
      <section class="contact-section">
        <form id="contactForm" class="contact-form" onsubmit="handleFormSubmit(event)">
          <div class="form-row">
            <div class="form-field">
              <label for="name">Namn</label>
              <input type="text" id="name" name="name" required placeholder="Ditt namn">
            </div>
            <div class="form-field">
              <label for="email">E-post</label>
              <input type="email" id="email" name="email" required placeholder="namn@foretag.se">
            </div>
          </div>
          <div class="form-field">
            <label for="message">Meddelande</label>
            <textarea id="message" name="message" rows="3" required placeholder="Skriv ditt meddelande här..."></textarea>
          </div>
          <div class="form-actions">
            <button type="submit" class="submit-btn" id="submitBtn">
              <span>SKICKA MEDDELANDE</span>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </button>
          </div>
          <p id="formStatus" class="form-status"></p>
        </form>

        <div class="direct-contact">
          <span class="direct-label">Direktkontakt:</span>
          <a href="mailto:hampus@glng.se" class="email-link">hampus@glng.se</a>
        </div>
      </section>
    </main>

    <!-- Bottom Legal / Company Meta -->
    <footer class="site-footer">
      <div class="footer-meta">
        <span>GLNG AB</span>
        <span class="sep">•</span>
        <span>Org.nr 559329-9216</span>
        <span class="sep">•</span>
        <span>Godkänd för F-skatt</span>
      </div>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
